name: 一键编译自律APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: 编译 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 读取源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: 重命名 APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "自律-v2.1.0.apk"

      - name: 上传可安装 APK
        uses: actions/upload-artifact@v4
        with:
          name: 自律-APK
          path: 自律-v2.1.0.apk
          if-no-files-found: error
          retention-days: 30
